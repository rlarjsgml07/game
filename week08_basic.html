<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>장애물 피하기 게임</title>
    <style>
        body {
            text-align: center;
            font-family: Arial;
        }

        canvas {
            border: 2px solid black;
            background: #f9f9f9;
        }

        #restartBtn {
            display: none;
            margin: 15px auto 0;
            padding: 10px 25px;
            font-size: 16px;
            font-weight: bold;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        #restartBtn:hover {
            background-color: #45a049;
        }
    </style>
</head>

<body>
    <h1>장애물 피하기 게임</h1>
    <p>점수: <span id="score">0</span> | 체력: <span id="hp">100</span></p>
    <p>조작: 방향키 ↑ ↓ ← →</p>
    <canvas id="gameCanvas" width="600" height="400"></canvas>
    <br>
    <button id="restartBtn">다시 시작</button>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    const scoreText = document.getElementById("score");
    const hpText = document.getElementById("hp");
    const restartBtn = document.getElementById("restartBtn");

    let score = 0;
    let hp = 100;
    let gameOver = false;
    let speedBonus = 0;

    const player = {
        x: 280,
        y: 330,
        width: 40,
        height: 40,
        speed: 6
    };

    function drawPlayer(){
        ctx.fillStyle = "royalblue";
        ctx.fillRect(player.x, player.y, player.width, player.height);
    }

    const keys = {};

    document.addEventListener("keydown", function (event){
        keys[event.key] = true;
    });

    document.addEventListener("keyup", function (event){
        keys[event.key] = false;
    });

    function movePlayer(){
        if(keys["ArrowLeft"]){
            player.x -= player.speed;
        }
        if(keys["ArrowRight"]){
            player.x += player.speed;
        }
        if(keys["ArrowUp"]){
            player.y -= player.speed;
        }
        if(keys["ArrowDown"]){
            player.y += player.speed;
        }

        if(player.x < 0) player.x = 0;
        if(player.x + player.width > canvas.width) player.x = canvas.width - player.width;
        if(player.y < 0) player.y = 0;
        if(player.y + player.height > canvas.height) player.y = canvas.height - player.height;
    }

    const rocks = [];

    function creatRock() {
        // 한 번에 2개 ~ 4개의 돌을 동시에 생성
        const rockCount = Math.floor(Math.random() * 3) + 2; 

        for (let i = 0; i < rockCount; i++) {
            const isRed = Math.random() < 0.25;
            const rock = {
                x: Math.random() * (canvas.width - 30),
                y: -30 - Math.random() * 30, // 약간의 시차 발생
                width: 30,
                height: 30,
                speed: Math.random() * 3 + 2 + speedBonus,
                damage: isRed ? 40 : 20,
                color: isRed ? "red" : "gray"
            };
            rocks.push(rock);
        }
    }

    function drawRocks() {
        for (let rock of rocks) {
            ctx.fillStyle = rock.color;
            ctx.beginPath();
            ctx.arc(
                rock.x + rock.width / 2,
                rock.y + rock.height / 2,
                rock.width / 2,
                0,
                Math.PI * 2
            );
            ctx.fill();
        }
    }

    function moveRocks() {
        for (let rock of rocks) {
            rock.y += rock.speed;
        }
        for (let i = rocks.length - 1; i >= 0; i--) {
            if (rocks[i].y > canvas.height) {
                rocks.splice(i, 1);
                score++;
                scoreText.textContent = score;
            }
        }
    }

    function checkCollision() {
        for (let i = rocks.length - 1; i >= 0; i--) {
            const rock = rocks[i];

            if(player.x < rock.x + rock.width &&
                player.x + player.width > rock.x &&
                player.y < rock.y + rock.height &&
                player.y + player.height > rock.y) {
                    hp -= rock.damage;

                    if(hp < 0) {
                        hp = 0;
                    }
                    hpText.textContent = hp;
                    rocks.splice(i, 1);
                    if(hp <= 0) {
                        endGame();
                    }
                }
        }
    }

    function drawHpBar() {
        ctx.fillStyle = "lightgray";
        ctx.fillRect(20, 20, 200, 20);

        if (hp <= 20) {
            ctx.fillStyle = "red";
        } else if (hp <= 40) {
            ctx.fillStyle = "orange";
        } else {
            ctx.fillStyle = "limegreen";
        }

        ctx.fillRect(20, 20, hp * 2, 20);
        ctx.strokeStyle = "black";
        ctx.strokeRect(20, 20, 200, 20);
    }

    function endGame() {
        gameOver = true;

        ctx.fillStyle = "rgba(0, 0, 0, 0.7)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = "white";
        ctx.font = "bold 28px Arial";
        ctx.textAlign = "center";
        ctx.fillText("게임 오버!", canvas.width / 2, canvas.height / 2 - 15);
        ctx.fillText("최종 점수: " + score, canvas.width / 2, canvas.height / 2 + 25);

        restartBtn.style.display = "inline-block";
    }

    function restartGame() {
        score = 0;
        hp = 100;
        speedBonus = 0;
        gameOver = false;
        rocks.length = 0;
        player.x = 280;
        player.y = 330;

        scoreText.textContent = score;
        hpText.textContent = hp;
        restartBtn.style.display = "none";

        gameLoop();
    }

    restartBtn.addEventListener("click", restartGame);

    function gameLoop() {
        if(gameOver) return;

        speedBonus += 0.0015;

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        movePlayer();
        moveRocks();
        checkCollision();
        drawHpBar();
        drawPlayer();
        drawRocks();
        requestAnimationFrame(gameLoop);
    }

    gameLoop();
    setInterval(creatRock, 800);

</script>
</body>

</html>
