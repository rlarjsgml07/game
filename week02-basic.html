<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>두더지 잡기</title>

<style>
body {
    text-align: center;
    font-family: Arial;
}

canvas {
    border: 2px solid black;
}
</style>

</head>
<body>

<h1>두더지 잡기</h1>

<p>
점수 :
<span id="score">0</span>
</p>

<canvas id="gameCanvas"
        width="600"
        height="400">
</canvas>
    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let moleX = 300;
        let moleY = 200;
        let moleRadius = 30;

        let score = 0;

        function drawMole() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.beginPath();
            ctx.arc(moleX, moleY, moleRadius, 0, Math.PI * 2);
            ctx.fillstyle = "brown";
            ctx.fill();
        }
        // drawMole();

        function moveMole() {
            moleX = Math.random() * (canvas.width - 80) + 40;
            moleY = Math.random() * (canvas.height - 80) + 40;
            drawMole();
        }
        setInterval(moveMole, 1000);

        canvas.addEventListener("click", function (event) {
            const rect = canvas.getBoundingClientRect();
            const mouseX = event.clientX - rect.left;
            const mouseY = event.clientY - rect.top;
        });
    </script>

</body>
</html>
